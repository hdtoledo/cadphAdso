<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explorador de Formación ADSO | SENA CADPH Garzón</title>
  <meta name="description" content="Repositorio formativo y portal de explicaciones técnicas para la formación ADSO (Análisis y Desarrollo de Software) - SENA CADPH Garzón, Huila.">
  <link rel="icon" type="image/svg+xml" href="assets/images/sena_logo.svg">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            sena: {
              green: '#39a900',
              hover: '#2e8b00',
              dark: '#007832',
              light: '#f2f9ed',
              accent: '#4ade80'
            },
            gov: {
              blue: '#3366cc',
              darkblue: '#1e4b9e'
            },
            portal: {
              dark: '#0b3244',
              teal: '#0e4359',
              lightbg: '#f4f6f8',
              card: '#ffffff'
            }
          },
          fontFamily: {
            sans: ['"Work Sans"', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Fonts: Work Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-[#f0f3f6] text-slate-800 h-screen flex overflow-hidden antialiased selection:bg-sena-green selection:text-white">

  <!-- Enlace accesible para saltar directamente al contenido principal -->
  <a href="#mainContent" class="skip-link">Saltar al contenido principal</a>

  <!-- ================= CONTENEDOR DEL DASHBOARD EXPLORADOR ================= -->
  <div id="dashboardLayout" class="flex-1 flex w-full h-full relative overflow-hidden">
    
    <!-- Componente: Barra Lateral (Sidebar) -->
    <div data-component="components/layout/sidebar.html"></div>

    <!-- ================= CONTENEDOR DE CONTENIDO (DERECHA) ================= -->
    <div class="flex-1 flex flex-col min-w-0 h-full overflow-hidden relative">

      <!-- Componente: Barra Superior de Navegación (Header) -->
      <div data-component="components/layout/header.html"></div>

      <!-- ================= CONTENIDO PRINCIPAL SCROLLEABLE ================= -->
      <main id="mainContent" tabindex="-1" class="flex-1 flex flex-col min-w-0 overflow-y-auto custom-scroll relative w-full outline-none">

        <!-- ================= CONTENEDOR DE PESTAÑAS / VISTAS MODULARES ================= -->
        <div class="p-4 sm:p-6 md:p-10 space-y-6 sm:space-y-8 flex-1">
          <!-- Vista 1: Diseño Curricular Oficial (PDF & Competencias) -->
          <div data-component="components/views/tab-diseno.html"></div>

          <!-- Vista 2: Guías de Aprendizaje & Materiales de Formación -->
          <div data-component="components/views/tab-guias.html"></div>

          <!-- Vista 3: Fases Metodológicas del Proyecto Formativo -->
          <div data-component="components/views/tab-fases.html"></div>

          <!-- Vista 4: Acerca del Programa ADSO & Repositorio -->
          <div data-component="components/views/tab-ficha.html"></div>
        </div>

        <!-- Componente: Footer Institucional -->
        <div data-component="components/layout/footer.html"></div>
      </main>

      <!-- Componente: Botón Flotante y Menú de Accesibilidad -->
      <div data-component="components/layout/accessibility.html"></div>

    </div>
  </div>

  <!-- ================= MODALES DEL SISTEMA ================= -->
  <!-- Modal 1: Confirmación Genérica -->
  <div data-component="components/modals/modal-confirm.html"></div>

  <!-- Modal 2: Asistente Virtual / FAQ -->
  <div data-component="components/modals/modal-assistant.html"></div>

  <!-- Modal 3: Resumen Ejecutivo Curricular -->
  <div data-component="components/modals/modal-curriculum.html"></div>

  <!-- Modal 4: Detalle de Sesión Formativa -->
  <div data-component="components/modals/modal-session.html"></div>

  <!-- Scripts del Sistema ADSO -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="assets/js/competencias-data.js"></script>
  <script src="assets/js/guias-fase1-data.js"></script>
  <script src="assets/js/guias-viewer.js"></script>
  <script src="assets/js/pdf-viewer.js"></script>
  <script src="assets/js/accessibility.js"></script>
  <script src="assets/js/component-loader.js"></script>
  <script src="assets/js/dashboard.js"></script>
</body>
</html>
