<!-- ================= BOTÓN FLOTANTE Y MENÚ DE ACCESIBILIDAD ================= -->
<aside aria-label="Herramientas de accesibilidad" class="fixed right-0 top-1/2 -translate-y-1/2 z-40">
  <button id="accessibilityToggleBtn" onclick="toggleAccessibilityMenu()" class="w-10 h-12 bg-sena-green hover:bg-sena-hover text-white rounded-l-2xl flex items-center justify-center shadow-2xl cursor-pointer transition focus:outline-none focus:ring-2 focus:ring-white focus:ring-offset-2" title="Opciones de accesibilidad web (Alt+A)" aria-label="Abrir opciones de accesibilidad web" aria-haspopup="dialog" aria-expanded="false" aria-controls="accessibilityMenu">
    <i data-lucide="accessibility" class="w-5 h-5"></i>
  </button>

  <!-- Menú desplegable de Accesibilidad -->
  <div id="accessibilityMenu" role="region" aria-label="Panel de opciones de accesibilidad" class="hidden absolute right-12 top-0 w-64 bg-white rounded-2xl shadow-2xl border border-slate-200 p-4 text-xs space-y-3 z-50 transform transition-all duration-200">
    <div class="font-bold text-slate-800 border-b border-slate-100 pb-2 flex items-center justify-between">
      <div class="flex items-center gap-2 text-sena-dark">
        <i data-lucide="eye" class="w-4 h-4"></i>
        <span class="text-xs font-bold text-slate-800">Accesibilidad Web</span>
      </div>
      <button onclick="toggleAccessibilityMenu(false)" class="text-slate-400 hover:text-slate-600 p-1 rounded-md" aria-label="Cerrar panel de accesibilidad">
        <i data-lucide="x" class="w-3.5 h-3.5"></i>
      </button>
    </div>

    <!-- Control de Tamaño de Texto -->
    <div>
      <div class="flex justify-between items-center text-[11px] font-semibold text-slate-600 mb-1.5">
        <span>Tamaño de Texto</span>
        <span id="zoomPercentageBadge" class="px-2 py-0.5 rounded-full bg-emerald-50 text-sena-green font-bold text-[10px] border border-emerald-200">100%</span>
      </div>
      <div class="grid grid-cols-3 gap-1.5">
        <button onclick="adjustFontSize(-1)" class="py-1.5 px-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-lg flex items-center justify-center gap-1 transition" title="Disminuir tamaño de letra" aria-label="Disminuir tamaño de letra">
          <span>A-</span>
        </button>
        <button onclick="resetFontSize()" class="py-1.5 px-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg flex items-center justify-center gap-1 transition" title="Restablecer tamaño de letra al 100%" aria-label="Restablecer tamaño de letra">
          <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
        </button>
        <button onclick="adjustFontSize(1)" class="py-1.5 px-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-lg flex items-center justify-center gap-1 transition" title="Aumentar tamaño de letra" aria-label="Aumentar tamaño de letra">
          <span>A+</span>
        </button>
      </div>
    </div>

    <!-- Modos visuales interactivos -->
    <div class="space-y-1.5 pt-1 border-t border-slate-100">
      <!-- Modo Alto Contraste -->
      <button id="btnToggleContrast" onclick="toggleHighContrast()" class="w-full text-left px-2.5 py-2 hover:bg-slate-100 rounded-xl flex justify-between items-center text-slate-700 transition" aria-pressed="false">
        <span class="flex items-center gap-2">
          <i data-lucide="contrast" class="w-3.5 h-3.5 text-slate-500"></i>
          <span>Alto Contraste</span>
        </span>
        <span class="toggle-badge text-[10px] font-bold px-1.5 py-0.5 rounded bg-slate-200 text-slate-600">INACTIVO</span>
      </button>

      <!-- Subrayar Enlaces -->
      <button id="btnToggleUnderline" onclick="toggleUnderlineLinks()" class="w-full text-left px-2.5 py-2 hover:bg-slate-100 rounded-xl flex justify-between items-center text-slate-700 transition" aria-pressed="false">
        <span class="flex items-center gap-2">
          <i data-lucide="underline" class="w-3.5 h-3.5 text-slate-500"></i>
          <span>Subrayar Enlaces</span>
        </span>
        <span class="toggle-badge text-[10px] font-bold px-1.5 py-0.5 rounded bg-slate-200 text-slate-600">INACTIVO</span>
      </button>

      <!-- Lectura Legible -->
      <button id="btnToggleLegibleFont" onclick="toggleReadableFont()" class="w-full text-left px-2.5 py-2 hover:bg-slate-100 rounded-xl flex justify-between items-center text-slate-700 transition" aria-pressed="false">
        <span class="flex items-center gap-2">
          <i data-lucide="type" class="w-3.5 h-3.5 text-slate-500"></i>
          <span>Lectura Clara</span>
        </span>
        <span class="toggle-badge text-[10px] font-bold px-1.5 py-0.5 rounded bg-slate-200 text-slate-600">INACTIVO</span>
      </button>
    </div>

    <!-- Restablecer Todo -->
    <div class="pt-2 border-t border-slate-100">
      <button onclick="resetAllAccessibility()" class="w-full py-1.5 text-center text-slate-500 hover:text-rose-600 hover:bg-rose-50 rounded-lg font-medium transition text-[11px] flex items-center justify-center gap-1.5">
        <i data-lucide="refresh-cw" class="w-3 h-3"></i>
        <span>Restablecer todo</span>
      </button>
    </div>
  </div>
</aside>
